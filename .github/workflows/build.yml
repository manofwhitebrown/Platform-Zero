name: build
on:
  push:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate content
        run: python3 tools/validate_content.py

  build:
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Debug keystore and editor settings
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore /root/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          SDK=$(ls -d /usr/lib/android-sdk /usr/local/lib/android/sdk 2>/dev/null | head -n1)
          JDK=$(dirname "$(dirname "$(readlink -f "$(which keytool)")")")
          echo "SDK=$SDK JDK=$JDK"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JDK"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/shutdown_adb_on_exit = true
          EOT
          sed -i 's/^          //' ~/.config/godot/editor_settings-4.3.tres
      - name: Import project
        run: godot --headless --import || true
      - name: Run tests
        run: godot --headless --script tests/run_tests.gd
      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/unclaimed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: unclaimed-apk
          path: build/unclaimed.apk
