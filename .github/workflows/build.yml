name: build
on:
  push:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate content
        run: python3 tools/validate_content.py --strict

  build:
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Debug keystore and editor settings
        run: |
          set -x
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore $HOME/ci-debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12 2>&1 | tee -a /tmp/ci.log
          SDK=$(ls -d /usr/lib/android-sdk /usr/local/lib/android/sdk 2>/dev/null | head -n1 || true)
          JDK=$(dirname "$(dirname "$(readlink -f "$(command -v keytool)")")")
          echo "SDK=$SDK JDK=$JDK" | tee -a /tmp/ci.log
          mkdir -p "$HOME/.config/godot" "$HOME/.local/share/godot"
          if [ "$HOME" != "/root" ] && [ -d /root/.local/share/godot/export_templates ]; then
            ln -sfn /root/.local/share/godot/export_templates "$HOME/.local/share/godot/export_templates"
          fi
          echo "HOME=$HOME" | tee -a /tmp/ci.log
          ls "$HOME/.local/share/godot/export_templates" | tee -a /tmp/ci.log
          printf '%s\n' '[gd_resource type="EditorSettings" format=3]' '' '[resource]' \
            "export/android/android_sdk_path = \"$SDK\"" \
            "export/android/java_sdk_path = \"$JDK\"" \
            "export/android/debug_keystore = \"$HOME/ci-debug.keystore\"" \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' \
            'export/android/shutdown_adb_on_exit = true' > "$HOME/.config/godot/editor_settings-4.3.tres"
      - name: Install Android SDK 34
        run: |
          set +e +o pipefail
          SDK=/usr/lib/android-sdk
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null 2>&1
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -8 | tee -a /tmp/ci.log
          ls "$SDK/build-tools" "$SDK/platforms" | tee -a /tmp/ci.log
          exit 0
      - name: SDK diagnostics
        run: |
          SDK=$(grep android_sdk_path "$HOME/.config/godot/editor_settings-4.3.tres" | cut -d'"' -f2)
          for d in "$SDK" "$SDK/build-tools" "$SDK/platforms" "$SDK/platform-tools" "$SDK/cmdline-tools"; do echo "== $d"; ls "$d" 2>&1 | head -20; done | tee -a /tmp/ci.log
          java -version 2>&1 | tee -a /tmp/ci.log
          ls "$HOME/.local/share/godot/export_templates/4.3.stable" 2>&1 | head -30 | tee -a /tmp/ci.log
      - name: Write cheat hash (from secret, never committed)
        env:
          CHEAT_PW_HASH: ${{ secrets.CHEAT_PW_HASH }}
        run: |
          mkdir -p generated
          if [ -n "$CHEAT_PW_HASH" ]; then
            printf 'const HASH := "%s"\n' "$CHEAT_PW_HASH" > generated/cheat_hash.gd
          fi
      - name: Import project
        run: godot --headless --import 2>&1 | tee -a /tmp/ci.log || true
      - name: Fail on engine script errors
        run: |
          if grep -E "GDScript::reload \(res://(autoload|tests)/" /tmp/ci.log > /tmp/script_errors.txt; then
            echo "::error title=Engine script errors::$(sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\n/%0A/g' /tmp/script_errors.txt | head -c 3000)"
            exit 1
          fi
      - name: Run tests
        run: godot --headless --script tests/run_tests.gd 2>&1 | tee -a /tmp/ci.log
      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/platform-zero.apk 2>&1 | tee -a /tmp/ci.log
          ls -la build | tee -a /tmp/ci.log
      - name: Assert launcher icon is in the APK
        run: |
          apt-get install -y -qq unzip >/dev/null 2>&1 || true
          unzip -l build/platform-zero.apk > /tmp/apk_list.txt
          # Godot names Android launcher resources icon / icon_foreground / icon_background
          for f in "res/mipmap-anydpi-v26/icon.xml" "res/mipmap-xxxhdpi-v4/icon_foreground.png" "res/mipmap-xxxhdpi-v4/icon_background.png"; do
            if ! grep -q "$f" /tmp/apk_list.txt; then
              echo "::error title=Launcher icon missing::APK lacks $f (check export_presets.cfg launcher_icons)"
              exit 1
            fi
          done
          for p in main_192x192 adaptive_foreground_432x432 adaptive_background_432x432; do
            v=$(grep "launcher_icons/$p" export_presets.cfg | cut -d'"' -f2)
            if [ -z "$v" ]; then echo "::error title=Launcher icon unset::launcher_icons/$p is empty"; exit 1; fi
          done
          echo "launcher icon resources present"
      - name: Report failure tail
        if: failure()
        run: |
          echo "::error title=CI log tail::$(grep -vE '^(SCRIPT ERROR|ERROR: Failed|[[:space:]]+at:|[[:space:]]*$)' /tmp/ci.log | grep -v -E '^(Parse Error|Compile Error)' | tail -c 3800 2>/dev/null | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r//g' -e 's/\n/%0A/g')"
      - uses: actions/upload-artifact@v4
        with:
          name: platform-zero-apk
          path: build/platform-zero.apk

  screens:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: barichello/godot-ci:4.3
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Xvfb + software GL
        run: apt-get update -qq && apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libegl1 git
      - name: Import project
        run: godot --headless --import 2>&1 | tail -5 || true
      - name: Take screenshots (sizes per shot from tests/shots.json)
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1920x1920x24" godot --rendering-driver opengl3 --script tools/shoot.gd 2>&1 | grep -vi "alsa\|audio" | tail -30
          ls -la docs/screens
      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: docs/screens
      - name: Commit screenshots to main
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screens
          if git diff --cached --quiet; then echo "no screenshot changes"; exit 0; fi
          git commit -m "[bot] update screenshots [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              echo "screenshots pushed (attempt $i)"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push lost the race (attempt $i), retrying"
            sleep $((i * 3))
          done
          echo "::warning title=Screenshots not committed::lost the push race 5 times; run is still green"
          exit 0
