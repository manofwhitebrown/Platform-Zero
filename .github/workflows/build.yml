name: build
on:
  push:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate content
        run: python3 tools/validate_content.py

  build:
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Debug keystore and editor settings
        run: |
          set -x
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore $HOME/ci-debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12 2>&1 | tee -a /tmp/ci.log
          SDK=$(ls -d /usr/lib/android-sdk /usr/local/lib/android/sdk 2>/dev/null | head -n1 || true)
          JDK=$(dirname "$(dirname "$(readlink -f "$(command -v keytool)")")")
          echo "SDK=$SDK JDK=$JDK" | tee -a /tmp/ci.log
          mkdir -p "$HOME/.config/godot" "$HOME/.local/share/godot"
          if [ "$HOME" != "/root" ] && [ -d /root/.local/share/godot/export_templates ]; then
            ln -sfn /root/.local/share/godot/export_templates "$HOME/.local/share/godot/export_templates"
          fi
          echo "HOME=$HOME" | tee -a /tmp/ci.log
          ls "$HOME/.local/share/godot/export_templates" | tee -a /tmp/ci.log
          printf '%s\n' '[gd_resource type="EditorSettings" format=3]' '' '[resource]' \
            "export/android/android_sdk_path = \"$SDK\"" \
            "export/android/java_sdk_path = \"$JDK\"" \
            "export/android/debug_keystore = \"$HOME/ci-debug.keystore\"" \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' \
            'export/android/shutdown_adb_on_exit = true' > "$HOME/.config/godot/editor_settings-4.3.tres"
      - name: SDK diagnostics
        run: |
          SDK=$(grep android_sdk_path "$HOME/.config/godot/editor_settings-4.3.tres" | cut -d'"' -f2)
          for d in "$SDK" "$SDK/build-tools" "$SDK/platforms" "$SDK/platform-tools" "$SDK/cmdline-tools"; do echo "== $d"; ls "$d" 2>&1 | head -20; done | tee -a /tmp/ci.log
          java -version 2>&1 | tee -a /tmp/ci.log
          ls "$HOME/.local/share/godot/export_templates/4.3.stable" 2>&1 | head -30 | tee -a /tmp/ci.log
      - name: Import project
        run: godot --headless --import 2>&1 | tee -a /tmp/ci.log || true
      - name: Run tests
        run: godot --headless --script tests/run_tests.gd 2>&1 | tee -a /tmp/ci.log
      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/unclaimed.apk 2>&1 | tee -a /tmp/ci.log
          ls -la build | tee -a /tmp/ci.log
      - name: Report failure tail
        if: failure()
        run: |
          echo "::error title=CI log tail::$(grep -vE '^(SCRIPT ERROR|ERROR: Failed|[[:space:]]+at:)' /tmp/ci.log | tail -c 3600 2>/dev/null | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r//g' -e 's/\n/%0A/g')"
      - uses: actions/upload-artifact@v4
        with:
          name: unclaimed-apk
          path: build/unclaimed.apk
